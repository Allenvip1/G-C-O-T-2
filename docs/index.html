<style>

  html{background:var(--bg)}

  .card{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  .col>h2{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  .sub{color:var(--mute);font-size:12px;margin-bottom:12px}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
  .bar label{color:var(--mute);font-size:12px;display:flex;gap:6px;align-items:center}
  input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;width:80px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-bottom:12px}
  .legend label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--text)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .col{min-width:0}
  .col>h2{font-size:16px;margin:0 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
  .card h3{font-size:12px;margin:0 0 6px;color:var(--mute);font-weight:600}
  .chart{height:280px}
  .tbw{overflow-x:auto}
  .tbcard{background:rgba(255,255,255,.90)}
  @media (prefers-color-scheme: dark){.tbcard{background:rgba(22,27,34,.88)}}
  .ftr{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 2px;margin-top:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .ftr .sub{color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mute);font-weight:600}
  td small{color:var(--mute)}
  .tip{position:absolute;z-index:20;pointer-events:none;display:none;min-width:200px;background:var(--panel);color:var(--text);border:1px solid var(--mute);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.7;box-shadow:0 4px 14px var(--glow);white-space:nowrap}
  .tip .h{color:var(--mute);border-bottom:1px solid var(--line);margin-bottom:3px;padding-bottom:2px}
  .tip .r{display:flex;justify-content:space-between;gap:18px}.tip .r span:first-child{color:var(--mute)}
  .hi{color:#ef5350}.lo{color:#26a69a}
  @media (max-width:900px){.grid{grid-template-columns:1fr}.chart{height:240px}}
</style>

}
const row = (a,b) => `<div class="r"><span>${a}</span><span>${b}</span></div>`;
const num = v => v==null ? '–' : Math.round(v).toLocaleString();
const sg = v => v==null ? '–' : (v>0?'+':'')+Math.round(v).toLocaleString();
const ix = v => v==null ? '–' : `<span class="${v>=80?'hi':v<=20?'lo':''}">${v.toFixed(1)}</span>`;
const dot = t => `<span style="color:${t.color}">●</span>`;

function showTip(a, param, p){
  const tip = a.tip;
  if(!param.time || !param.point || param.point.x<0 || param.point.y<0 || !p.di){ tip.style.display='none'; return; }
  const t = param.time, i = p.di.get(t);
  if(i==null){ tip.style.display='none'; return; }
  let h = `<div class="h">${p.c.name.split(' ')[0]} · COT 报告日 ${t}</div>`;
  if(a.k==='pr'){
    const k = p.candle.get(t);
    h += k ? row('开',k.open)+row('高',k.high)+row('低',k.low)+row('收',`<b>${k.close}</b>`)+row('当周涨跌',`<span class="${k.close>=k.open?'hi':'lo'}">${(k.close>=k.open?'+':'')+((k.close/k.open-1)*100).toFixed(2)}%</span>`) : row('当周无期货行情','');
  } else if(a.k==='net'){
    CATS.filter(c=>shown.has(c.k)).forEach(c=>{ const v=p.nets[c.k][i], pv=i>0?p.nets[c.k][i-1]:null;
      h += row(`${dot(c)} ${c.name.split(' ')[0]}净持仓`, `<b>${num(v)}</b> 手（较上周 ${pv==null?'–':sg(v-pv)}）`); });
  } else {
    CATS.filter(c=>shown.has(c.k)).forEach(c=>{ h += row(`${dot(c)} ${c.name.split(' ')[0]}COT指数`, ix(p.idxv[c.k][i])); });
  }
  tip.innerHTML = h; tip.style.display='block';
  const W=a.el.clientWidth, H=a.el.clientHeight, w=tip.offsetWidth, ht=tip.offsetHeight;
  let x=param.point.x+18, y=param.point.y-ht/2;
  if(x+w>W-4) x=param.point.x-w-18;
  tip.style.left=Math.max(2,x)+'px'; tip.style.top=Math.max(2,Math.min(H-ht-2,y))+'px';
}
function build(code){
  const c = COT_DATA.contracts[code];
  const col = document.createElement('div');
  col.className = 'col';
  col.innerHTML = `<h2>${c.name}</h2>
    <div class="card"><h3>周线（CME E-mini 期货连续合约，红涨绿跌；每周K线对齐到当周COT报告日）</h3><div class="chart" style="height:300px"></div></div>
    <div class="card"><h3>净持仓（多头 − 空头，手数）</h3><div class="chart"></div></div>
    <div class="card"><h3>COT 指数（0–100）</h3><div class="chart"></div></div>
    <div class="card tbcard"><h3>最近 30 周（净持仓手数 · COT 指数）</h3><div class="tbw"><table class="cot-tb"></table></div></div>`;
  document.getElementById('grid').appendChild(col);
  const [e0, e1, e2] = col.querySelectorAll('.chart');
  const pr = mkChart(e0, v=>v.toFixed(1));
  const sPr = pr.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',borderUpColor:'#ef5350',borderDownColor:'#26a69a',wickUpColor:'#ef5350',wickDownColor:'#26a69a',priceLineVisible:false});
  const net = mkChart(e1, v=>Math.round(v).toLocaleString());
  const idx = mkChart(e2, v=>v.toFixed(0));
  const sNet = {}, sIdx = {};
  CATS.forEach(t=>{
    sNet[t.k] = net.addLineSeries({color:t.color, lineWidth:2, priceLineVisible:false});
    sIdx[t.k] = idx.addLineSeries({color:t.color, lineWidth:2, priceLineVisible:false});
  });
  [80,50,20].forEach(p=>sIdx.lev.createPriceLine({price:p, color:css('--line'), lineStyle:2, axisLabelVisible:false, title:''}));
  let busy=false;
  const all=[{ch:pr,s:sPr,k:'pr',el:e0},{ch:net,s:sNet.lev,k:'net',el:e1},{ch:idx,s:sIdx.lev,k:'idx',el:e2}];
  let hover=null; const P={};
  const vals={pr:new Map(),net:new Map(),idx:new Map()};
  for(const a of all){
    a.el.style.position='relative'; a.tip=document.createElement('div'); a.tip.className='tip'; a.el.appendChild(a.tip);
    a.el.addEventListener('mouseenter',()=>{hover=a;});
    a.el.addEventListener('mouseleave',()=>{ if(hover===a) hover=null; a.tip.style.display='none'; });
    a.ch.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(busy||!r) return; busy=true; all.forEach(o=>{ if(o!==a) o.ch.timeScale().setVisibleLogicalRange(r); }); busy=false; });
    a.ch.subscribeCrosshairMove(param=>{ if(busy) return;
      if(!hover || hover===a) showTip(a, param, P.p);
      if(hover && hover!==a) return; busy=true;
      all.forEach(o=>{ if(o===a) return; const v = param.time && vals[o.k].get(param.time); if(v==null) o.ch.clearCrosshairPosition(); else o.ch.setCrosshairPosition(v,param.time,o.s); });
      busy=false; });
  }
  const panel = {code, c, pr, sPr, vals, net, idx, sNet, sIdx, tb: col.querySelector('table.cot-tb')};
  P.p = panel; panels.push(panel);
}
function render(){
  const lb = Math.max(10, +document.getElementById('lb').value||26);
  const vis = Math.max(20, +document.getElementById('vis').value||260);
  for(const p of panels){
    const c = p.c, from = Math.max(0, c.dates.length - vis);
    const nets = netOf(c), idx = {};
    for(const k in nets) idx[k] = cotIndex(nets[k], lb);
    CATS.forEach(t=>{
      const on = shown.has(t.k);
      p.sNet[t.k].setData(on ? pts(c.dates, nets[t.k], from) : []);
      p.sIdx[t.k].setData(on ? pts(c.dates, idx[t.k], from) : []);
    });
    // 周线对齐到 COT 报告日：每个报告日取其所在周（周一~周日）的那根周K线
    const pw = (window.PRICE_DATA||{})[p.code]||[], cd = [];
    for(let i=from, j=0;i<c.dates.length;i++){
      const t = Date.parse(c.dates[i]);
      while(j+1<pw.length && Date.parse(pw[j+1][0])<=t) j++;
      const w = pw[j];
      if(w && t-Date.parse(w[0])<7*864e5 && t>=Date.parse(w[0])) cd.push({time:c.dates[i],open:w[1],high:w[2],low:w[3],close:w[4]});
    }
    p.sPr.setData(cd);
    p.nets=nets; p.idxv=idx; p.di=new Map(c.dates.map((d,i)=>[d,i])); p.candle=new Map(cd.map(x=>[x.time,x]));
    p.vals.pr=new Map(cd.map(x=>[x.time,x.close]));
    // 十字光标联动用的"锚点"取杠杆基金这条线（没有数据的周自动清除光标）
    p.vals.net=new Map(pts(c.dates, nets.lev, from).map(x=>[x.time,x.value]));
    p.vals.idx=new Map(pts(c.dates, idx.lev, from).map(x=>[x.time,x.value]));
    p.pr.timeScale().fitContent();
    p.net.timeScale().fitContent();
    p.idx.timeScale().fitContent();
    const last = c.dates.length, rows = [], cols = CATS.filter(t=>shown.has(t.k));
    for(let i=last-1;i>=Math.max(0,last-30);i--){
      rows.push(`<tr><td>${c.dates[i]}</td>${cols.map(t=>`<td>${nets[t.k][i].toLocaleString()} <small>·</small> ${ix(idx[t.k][i])}</td>`).join('')}</tr>`);
    }
    p.tb.innerHTML = `<tr><th>报告日</th>${cols.map(t=>`<th>${t.name.split(' ')[0]}</th>`).join('')}</tr>`+rows.join('');
  }
}
const bjTime = s => { const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(s || ""); if (!m) return s || "";      // 数据里存的是 UTC，页面上换成北京时间显示
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] + 8, +m[5])), p = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}（北京时间）`; };
try{
  document.getElementById('meta').textContent = '数据更新于 ' + bjTime(COT_DATA.updated);
  const lg = document.getElementById('legend');
  CATS.forEach(t=>{
    const lb = document.createElement('label');
    lb.innerHTML = `<input type="checkbox" ${shown.has(t.k)?'checked':''}><i style="background:${t.color}"></i>${t.name}`;
    lb.querySelector('input').onchange = e => { e.target.checked ? shown.add(t.k) : shown.delete(t.k); render(); };
    lg.appendChild(lb);
  });
  COT_DATA.order.forEach(build);
  document.getElementById('lb').onchange = render;
  document.getElementById('vis').onchange = render;
  render();
}catch(e){ document.getElementById('meta').textContent = '数据加载失败：' + e.message; }
</script>
</body>
</html>
